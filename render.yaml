# Nestopia API on Render. Frontend stays on Vercel.
# Dashboard: New → Blueprint → connect this repo.
# Free web service: no card, spins down after 15 idle minutes, uploads are wiped on sleep or redeploy.
services:
  - type: web
    name: nestopia-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nestopia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://nestopia-rental.vercel.app
      - key: CORS_ORIGINS
        value: https://nestopia-rental.vercel.app
      - key: PORT
        value: "10000"
      - key: USE_ML_MATCHING
        value: "false"
      - key: USE_SEMANTIC_MATCHING
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: nestopia-db
    plan: free
    databaseName: nestopia
    region: oregon
